name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile's node:20-alpine, so CI and the image
          # agree. npm's cache keys off package-lock.json.
          node-version: "20"
          cache: npm

      # ci, not install: fails on a lock file that disagrees with
      # package.json instead of quietly resolving something different.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
